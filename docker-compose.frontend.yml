# Front-end containers
#
# Unlike upstream kobo-docker, the environment files live in `./env` within this
# repository rather than in a sibling `../kobo-env` generated by kobo-install,
# so that a single `git clone` is enough to start the demo.

x-anchors:
  x-kpi-anchor: &django
    image: kobotoolbox/kpi:2.026.27e
    init: true
    env_file:
      - ./env/envfiles/aws.txt
      - ./env/envfiles/databases.txt
      - ./env/envfiles/django.txt
      - ./env/envfiles/external_services.txt
      - ./env/envfiles/domains.txt
      - ./env/envfiles/smtp.txt
    sysctls:
      - net.core.somaxconn=2048
    environment:
      - UWSGI_MAX_REQUESTS=512
      - UWSGI_WORKERS_COUNT=2
      - UWSGI_CHEAPER_RSS_LIMIT_SOFT=134217728
      - UWSGI_CHEAPER_WORKERS_COUNT=1
      - UWSGI_HARAKIRI=120
      - UWSGI_WORKER_RELOAD_MERCY=120
    volumes:
      - ./.vols/static/kpi:/srv/static
      - ./log/kpi:/srv/logs
      - ./scripts/wait_for_mongo.bash:/srv/init/wait_for_mongo.bash:ro
      - ./scripts/wait_for_postgres.bash:/srv/init/wait_for_postgres.bash:ro
      # Persistent storage for FileFields when S3 not used (e.g. exports, uploaded map layers)
      - ./.vols/kpi_media:/srv/src/kpi/media
      # Allow access to KoboCAT media uploads within KPI
      - ./.vols/kobocat_media_uploads:/srv/src/kobocat/media
    restart: unless-stopped
    networks:
      kobo-network:

services:
  kpi:
    <<: *django
    networks:
      kobo-network:
        aliases:
          - kpi.docker.container
          - kpi.internal
          - kobocat.docker.container
          - kobocat.internal

  worker:
    <<: *django
    command: ['bash', '/srv/src/kpi/docker/entrypoint_celery_kpi_worker.bash']

  worker_low_priority:
    <<: *django
    command: ['bash', '/srv/src/kpi/docker/entrypoint_celery_kpi_worker_low_priority.bash']

  worker_long_running_tasks:
    <<: *django
    command: ['bash', '/srv/src/kpi/docker/entrypoint_celery_kpi_worker_long_running_tasks.bash']

  worker_kobocat:
    <<: *django
    command: ['bash', '/srv/src/kpi/docker/entrypoint_celery_kobocat_worker.bash']

  beat:
    <<: *django
    command: ['bash', '/srv/src/kpi/docker/entrypoint_celery_beat.bash']

  nginx:
    image: nginx:1.27
    hostname: nginx
    env_file:
      - ./env/envfiles/domains.txt
      - ./env/envfiles/databases.txt
      - ./env/envfiles/django.txt
    environment:
      - UWSGI_PASS_TIMEOUT=130
      # Required: `30-init-kobo-nginx.sh` only generates a `uwsgi_pass` config
      # when this is exactly `uWSGI`. Without it nginx falls back to
      # `proxy_pass`, which cannot speak to KPI's uWSGI socket, and every
      # request fails.
      - WSGI=uWSGI
      # Empty because the demo is served on the standard port 80. If you publish
      # nginx on another port, set this to that port including the colon, e.g.
      # `:8080`, so generated absolute URLs keep working.
      - NGINX_PUBLIC_PORT=
      - TEMPLATED_VAR_REFS=$${PUBLIC_REQUEST_SCHEME} $${INTERNAL_DOMAIN_NAME} $${PUBLIC_DOMAIN_NAME} $${KOBOFORM_PUBLIC_SUBDOMAIN} $${KOBOCAT_PUBLIC_SUBDOMAIN} $${ENKETO_EXPRESS_PUBLIC_SUBDOMAIN}
    ports:
      - 80:80
    volumes:
        - ./.vols/static:/srv/www:ro
        - ./log/nginx:/var/log/nginx
        - ./.vols/kobocat_media_uploads:/media
        - ./.vols/kpi_media/__public:/srv/kpi_media/__public:ro
        - ./nginx/docker-entrypoint.d/30-init-kobo-nginx.sh:/docker-entrypoint.d/30-init-kobo-nginx.sh
        - ./nginx/kobo-docker-scripts/:/kobo-docker-scripts
    restart: unless-stopped
    networks:
      kobo-network:
        aliases:
          - nginx.internal
          - nginx.docker.container
          # KPI and Enketo call each other over these internal names, which the
          # nginx config serves alongside the public `*.kobo.local` ones. They
          # must match `*_PUBLIC_SUBDOMAIN` + `INTERNAL_DOMAIN_NAME` from
          # `env/envfiles/domains.txt`.
          - kf.docker.internal
          - kc.docker.internal
          - ee.docker.internal
          # The public names are aliased here too, because parts of the app
          # deliberately use public URLs for server-to-server calls: KPI posts to
          # `ENKETO_URL` to deploy a form, and Enketo posts submissions back to
          # `KOBOCAT_URL`. Upstream makes those resolve by giving every container
          # an `extra_hosts` entry pointing at the host's LAN IP, which hardcodes
          # one machine's address into the compose file. Letting Docker's own DNS
          # answer with the nginx container is equivalent and portable, and it
          # frees the host to map these names to 127.0.0.1.
          - kf.kobo.local
          - kc.kobo.local
          - ee.kobo.local

  enketo_express:
    image: kobotoolbox/enketo-express-extra-widgets:7.6.3
    init: true
    hostname: enketo_express
    env_file:
      - ./env/envfiles/domains.txt
    restart: unless-stopped
    volumes:
      - ./env/enketo_express/config.json:/srv/src/enketo/packages/enketo-express/config/config.json
    networks:
      kobo-network:
        aliases:
          - enketo_express.internal
          - enketo_express.docker.container

# Also declared identically in `docker-compose.backend.yml`; Compose merges the
# two so the front end can reach the `*.kobo.private` back-end aliases directly.
networks:
  kobo-network:
    driver: bridge
