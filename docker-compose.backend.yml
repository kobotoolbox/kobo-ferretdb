# Back-end containers

services:
  postgres:
    image: postgis/postgis:14-3.2
    hostname: postgres
    env_file:
      - ./env/envfiles/domains.txt
      - ./env/envfiles/databases.txt
      - ./env/envfiles/aws.txt
    volumes:
      - ./.vols/db:/var/lib/postgresql/data
      - ./backups/postgres:/srv/backups
      - ./log/postgres:/srv/logs
      - ./postgres:/kobo-docker-scripts
      - ./env/postgres/conf/postgres.conf:/kobo-docker-scripts/conf/postgres.conf
    command: "bash /kobo-docker-scripts/entrypoint.sh"
    restart: always
    stop_grace_period: 5m
    networks:
      kobo-network:
        aliases:
          - postgres.kobo.private

  # FerretDB's storage engine. This is a stock PostgreSQL image with the
  # DocumentDB extension preinstalled; FerretDB itself is stateless and keeps
  # everything here. It is deliberately separate from the `postgres` service
  # above, which holds the Django databases and runs a different major version.
  postgres_ferretdb:
    image: ghcr.io/ferretdb/postgres-documentdb:17-0.107.0-ferretdb-2.7.0
    hostname: postgres_ferretdb
    environment:
      # FerretDB authenticates clients against PostgreSQL roles, so this
      # user/password pair is what appears in `MONGO_DB_URL`.
      - POSTGRES_USER=ferret
      - POSTGRES_PASSWORD=badger
      - POSTGRES_DB=postgres
    volumes:
      - ./.vols/postgres_ferretdb:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ferret -d postgres']
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      kobo-network:
        aliases:
          - postgres_ferretdb.kobo.private

  # Stands in for MongoDB. The service keeps the name `mongo` and the
  # `mongo.kobo.private` alias so that KPI, KoboCAT and `wait_for_mongo.bash`
  # reach it without knowing the difference.
  #
  # None of upstream's `./mongo` entrypoint scripts are mounted here: they
  # configure a replica set and create users through `mongosh`, which FerretDB
  # neither needs nor supports. Users come from the PostgreSQL role above.
  mongo:
    image: ghcr.io/ferretdb/ferretdb:2.7.0
    hostname: mongo
    environment:
      - FERRETDB_POSTGRESQL_URL=postgres://ferret:badger@postgres_ferretdb.kobo.private:5432/postgres
    depends_on:
      postgres_ferretdb:
        condition: service_healthy
    restart: always
    networks:
      kobo-network:
        aliases:
          - mongo.kobo.private

  redis_main:
    image: redis:7.2
    env_file:
      - ./env/envfiles/domains.txt
      - ./env/envfiles/databases.txt
      - ./env/envfiles/aws.txt
    environment:
      - KOBO_REDIS_SERVER_ROLE=main
    volumes:
      - ./redis:/kobo-docker-scripts
      - ./backups/redis:/srv/backups
      - ./.vols/redis_main_data/:/data/
      - ./redis/redis-enketo-main.conf.tmpl:/etc/redis/redis.conf.tmpl:ro
      - ./redis/entrypoint.sh:/tmp/redis/entrypoint.sh:ro
      - ./log/redis_main:/var/log/redis
    restart: always
    stop_grace_period: 2m30s
    sysctls:
        - net.core.somaxconn=2048
    command: "bash /tmp/redis/entrypoint.sh"
    networks:
      kobo-network:
        aliases:
          - redis-main.kobo.private

  redis_cache:
    image: redis:7.2
    env_file:
      - ./env/envfiles/databases.txt
    environment:
      - KOBO_REDIS_SERVER_ROLE=cache
    volumes:
      - ./.vols/redis_cache_data/:/data/
      - ./redis/redis-enketo-cache.conf.tmpl:/etc/redis/redis.conf.tmpl:ro
      - ./redis/entrypoint.sh:/tmp/redis/entrypoint.sh:ro
      - ./log/redis_cache:/var/log/redis
    restart: always
    stop_grace_period: 2m30s
    sysctls:
        - net.core.somaxconn=2048
    command: "bash /tmp/redis/entrypoint.sh"
    networks:
      kobo-network:
        aliases:
          - redis-cache.kobo.private

# Upstream splits the front end and back end into two Compose projects joined by
# an external network, because they are meant to run on separate hosts. This demo
# runs everything on one host in one project, so a single bridge network with the
# `*.kobo.private` aliases upstream expects is enough.
networks:
  kobo-network:
    driver: bridge
